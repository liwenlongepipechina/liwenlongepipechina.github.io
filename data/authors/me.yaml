bio: |
  李文龙是一名专注于工业互联网与数据可视化方向的开发工程师，
  目前主要从事 IoT 物联网平台、数据共享平台与三维数字孪生系统的设计与开发。

  在工程实践中，致力于构建从设备数据采集、传输、存储到可视化展示的一体化数据链路，
  并结合 WebGL 与 Three.js 技术实现复杂工业场景的三维可视化表达。

  关注方向包括：
  - IoT 物联网数据平台架构设计
  - 工业数据可视化与大屏系统
  - 三维数字孪生（3D Digital Twin）
  - 时空数据分析与实时监控系统

